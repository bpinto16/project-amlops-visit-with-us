name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/preparation.py


  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    env:
      NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.
      - name: Install pyngrok
        run: pip install pyngrok==7.2.12
      - name: Start MLflow Tracking Server
        run: |
          nohup mlflow server --host 0.0.0.0 --port 5000 &
          echo "Waiting for MLflow server..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && echo "MLflow server ready." && break
            echo "  attempt $i — not ready, retrying in 5s..."
            sleep 5
          done
      - name: Start ngrok tunnel and set tracking URI
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_TOKEN
          nohup ngrok http 5000 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])")
          echo "Ngrok tunnel URL: ${NGROK_URL}"
          echo "MLFLOW_TRACKING_URI=${NGROK_URL}" >> $GITHUB_ENV
      - name: Model Building
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MLFLOW_HTTP_REQUEST_HEADER_ngrok-skip-browser-warning: "true"
        run: python tourism_project/model_building/train.py


  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training,data-prep,register-dataset]
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Push files to Frontend Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/hosting/hosting.py